apiVersion: apps/v1
kind: Deployment
metadata:
  name: savings-account-service
  namespace: aos
  labels:
    app.kubernetes.io/name: savings-account-service
    app.kubernetes.io/part-of: aos
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: savings-account-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: savings-account-service
        app.kubernetes.io/part-of: aos
    spec:
      containers:
        - name: savings-account-service
          image: aos-savings-account-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8084
              name: http
          env:
            - name: SPRING_DATASOURCE_URL
              valueFrom:
                configMapKeyRef:
                  name: aos-config
                  key: SAVINGS_DB_URL
            - name: SPRING_DATASOURCE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: aos-secrets
                  key: POSTGRES_USER
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: aos-secrets
                  key: POSTGRES_PASSWORD
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: aos-secrets
                  key: JWT_SECRET
          resources:
            requests:
              cpu: "200m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8084
            initialDelaySeconds: 25
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8084
            initialDelaySeconds: 40
            periodSeconds: 15
            timeoutSeconds: 3
---
apiVersion: v1
kind: Service
metadata:
  name: savings-account-service
  namespace: aos
  labels:
    app.kubernetes.io/name: savings-account-service
    app.kubernetes.io/part-of: aos
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: savings-account-service
  ports:
    - port: 8084
      targetPort: 8084
      name: http
